services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file: .env
    environment:
      GENERIC_TIMEZONE: ${TZ:-America/Los_Angeles}
      TZ: ${TZ:-America/Los_Angeles}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      STORE_API_URL: http://store-api:3000
      # The ingestion workflow reads the knowledge base from the mounted repo folder.
      N8N_RESTRICT_FILE_ACCESS_TO: /project/knowledge
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./:/project:ro
    depends_on:
      - qdrant
      - ollama
      - store-api

  # Vector database for the knowledge base.
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Local embeddings: free, offline, no API key.
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Downloads the embedding model once (about 270 MB), then exits.
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text:v1.5"]
    depends_on:
      - ollama
    restart: "no"

  # Stand-in for the store's order system and helpdesk.
  store-api:
    build: ./store-api
    image: support-bot-store-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - store_data:/data

  # The demo store website with the chat widget.
  site:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

volumes:
  n8n_data:
  qdrant_data:
  ollama_data:
  store_data:
